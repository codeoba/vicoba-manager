server {
    listen 80;
    listen 443 ssl http2;
    server_name vikoba.mdandu.com;

    # SSL (aaPanel auto-generates these)
    # ssl_certificate /etc/letsencrypt/live/vikoba.mdandu.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vikoba.mdandu.com/privkey.pem;

    # ← Point to the /public subfolder!
    root /www/wwwroot/vikoba.mdandu.com/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # Allow assets directly
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ =404;
    }

    # Allow uploads directly  
    location /uploads/ {
        expires 7d;
        try_files $uri =404;
        # Block PHP execution in uploads
        location ~ \.php$ { deny all; }
    }

    # Route everything else through index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handler
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;  # Adjust PHP version as needed
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Block access to sensitive files
    location ~ /\.(env|git|htaccess) { deny all; }
    location ~ /config/ { deny all; }
    location ~ /app/ { deny all; }
    location ~ /migrate/ { deny all; }
    location ~ /cron/ { deny all; }
    location ~ /migrations/ { deny all; }

    access_log /www/wwwlogs/vikoba.mdandu.com.log;
    error_log  /www/wwwlogs/vikoba.mdandu.com.error.log;
}
